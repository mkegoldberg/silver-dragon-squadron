# Netlify build + deploy config for the statically generated Nuxt site.
# Netlify publishes `dist`. On Netlify's build image Nitro auto-detects the
# platform and uses its `netlify-static` preset, which writes the generated
# site to `dist/` (not `.output/public`, which is what the plain `static`
# preset writes locally). Locally, `dist` is a symlink to `.output/public`, so
# the same path works in both places.

[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Preserve inbound links from the old WordPress URLs.

# Renamed project slugs (old demo slugs -> clean slugs).
[[redirects]]
  from = "/project/example-project-4"
  to = "/project/flight-controls"
  status = 301
  force = true

[[redirects]]
  from = "/project/example-project-3"
  to = "/project/avionics"
  status = 301
  force = true

[[redirects]]
  from = "/project/example_one"
  to = "/project/fuselage"
  status = 301
  force = true

# Renamed top-level page slugs.
[[redirects]]
  from = "/about-steve-kim"
  to = "/about-steve"
  status = 301
  force = true

# The blog and comments were removed (read-only visual site).
# Forward any old blog / category / feed links to the home page so they do not 404.
[[redirects]]
  from = "/hello-world"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/wp-admin/*"
  to = "/"
  status = 301
